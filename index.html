<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6fa4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Borinquito</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: #0b6fa4; touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 8px; right: 8px;
        display: flex; justify-content: space-between; pointer-events: none;
        font: 600 14px/1.2 system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #0008; }
      #hud span { background: #0006; padding: 6px 10px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"><span id="title">Borinquito</span><span id="info"></span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
